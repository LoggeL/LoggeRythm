<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- LoggeRythm step-sequencer mark: a 4x4 drum pattern whose set steps
       spell an L, plus one off-beat hit. Empty steps are small dots.
       Transparent background; the single brand fill is the web accent. -->
  <g id="lrMark" fill="#d6ff4b">
    <rect x="38" y="38" width="36" height="36" rx="10"/>
    <rect x="38" y="86" width="36" height="36" rx="10"/>
    <rect x="38" y="134" width="36" height="36" rx="10"/>
    <rect x="38" y="182" width="36" height="36" rx="10"/>
    <rect x="86" y="182" width="36" height="36" rx="10"/>
    <rect x="134" y="182" width="36" height="36" rx="10"/>
    <rect x="182" y="182" width="36" height="36" rx="10"/>
    <rect x="134" y="86" width="36" height="36" rx="10"/>
    <circle cx="104" cy="56" r="6"/>
    <circle cx="152" cy="56" r="6"/>
    <circle cx="200" cy="56" r="6"/>
    <circle cx="104" cy="104" r="6"/>
    <circle cx="200" cy="104" r="6"/>
    <circle cx="104" cy="152" r="6"/>
    <circle cx="152" cy="152" r="6"/>
    <circle cx="200" cy="152" r="6"/>
  </g>
</svg>
