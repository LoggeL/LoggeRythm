[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loggerythm-cli"
version = "0.1.0"
description = "Agent-friendly command-line client for LoggeRythm"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "keyring>=24,<27"]

[project.scripts]
loggerythm = "loggerythm_cli.main:main"

[tool.setuptools.packages.find]
include = ["loggerythm_cli*"]
